<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grab It All: a bright one-thumb collecting game for Android. Grab every treat, dodge the lasers, beat the boss. Free on Google Play.">
<meta property="og:title" content="Grab It All">
<meta property="og:description" content="Grab every treat, dodge the lasers, beat the boss. Free on Google Play.">
<meta property="og:image" content="https://rohithdevelops.github.io/grab-it-all-ad-landing-page/poster.jpg">
<meta property="og:url" content="https://rohithdevelops.github.io/grab-it-all-ad-landing-page/">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<title>Grab It All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column like the game's own menu: sky hero, trailer in a phone frame, white UI cards, green PLAY-style button. Single bright theme on purpose (the game's world). */
:root {
  --sky: #7fd0ff;
  --sky-deep: #4aa8ff;
  --ink: #4a2f2a;
  --card: #fffaf0;
  --grass: #4cc764;
  --grass-deep: #2f9a4a;
  --pink: #ff6f91;
  --sun: #ffd23f;
  --violet: #9a6bff;
  --muted: #7a5a4e;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font: 500 1.05rem/1.55 var(--body);
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hero {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 2rem);
  padding-bottom: 2.5rem;
  min-height: 100vh;
  background:
    repeating-conic-gradient(from 0deg at 50% 38%, #ffffff22 0deg 10deg, transparent 10deg 20deg),
    linear-gradient(var(--sky), var(--sky-deep) 140%);
  text-align: center;
}
.hero .wrap { display: grid; gap: 1rem; justify-items: center; }
.icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 6px 0 #0000001f; }
h1 {
  margin: 0;
  font: 700 clamp(2.8rem, 12vw, 4rem)/1 var(--display);
  letter-spacing: 0.01em;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 #4a2f2a40;
}
h1 span:nth-child(1) { color: var(--pink); }
h1 span:nth-child(2) { color: var(--sky-deep); }
h1 span:nth-child(3) { color: var(--sun); }
.tag { margin: 0; font: 600 1.2rem/1.35 var(--display); max-width: 26rem; text-wrap: balance; }
.play {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
  width: min(100%, 22rem);
  padding: 0.95rem 1.4rem;
  border-radius: 18px;
  background: var(--grass);
  color: #fff;
  font: 700 1.35rem/1.1 var(--display);
  text-decoration: none;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 0 var(--grass-deep);
  border: 3px solid #fff;
  transition: transform 0.12s, box-shadow 0.12s;
}
.play:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--grass-deep); }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--grass-deep); }
.play:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.play svg { width: 1.4rem; height: 1.4rem; flex: none; }
.fine { margin: 0; font-size: 0.92rem; color: var(--ink); opacity: 0.85; }

.phone {
  width: min(100%, 17rem);
  aspect-ratio: 9 / 16;
  max-width: 100%;
  border: 8px solid var(--ink);
  border-radius: 34px;
  overflow: hidden;
  background: var(--ink);
  box-shadow: 0 10px 0 #4a2f2a33;
}
.phone video { width: 100%; height: 100%; object-fit: cover; display: block; }

@media (prefers-reduced-motion: reduce) { .play { transition: none; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img class="icon" src="icon.png" alt="Grab It All app icon: Gobble the yellow blob" width="96" height="96">
    <h1 aria-label="Grab It All"><span>Grab</span> <span>It</span> <span>All</span></h1>
    <p class="tag">Steer Gobble with one thumb, grab every treat and dodge the lasers.</p>
    <div class="phone">
      <video src="trailer.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Grab It All gameplay trailer"></video>
    </div>
    <a class="play" href="https://play.google.com/store/apps/details?id=com.rohdev.io.grabitall&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3Dlaunch_reel">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.5v17a1 1 0 0 0 1.5.86l14.2-8.5a1 1 0 0 0 0-1.72L6.5 2.64A1 1 0 0 0 5 3.5z"/></svg>
      Get it on Google Play
    </a>
    <p class="fine">Free on Android</p>
  </div>
</header>

</body>
</html>
