<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Grab It All: a bright one-thumb collecting game for Android. Grab every treat, dodge the lasers, beat the boss. Free on Google Play.">
<meta property="og:title" content="Grab It All">
<meta property="og:description" content="Grab every treat, dodge the lasers, beat the boss. Free on Google Play.">
<meta property="og:image" content="https://rohithdevelops.github.io/grab-it-all-ad-landing-page/poster.jpg">
<meta property="og:url" content="https://rohithdevelops.github.io/grab-it-all-ad-landing-page/">
<meta property="og:type" content="website">
<link rel="icon" href="icon.png">
<title>Grab It All</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column like the game's own menu: sky hero, trailer in a phone frame, white UI cards, green PLAY-style button. Single bright theme on purpose (the game's world). */
:root {
  --sky: #7fd0ff;
  --sky-deep: #4aa8ff;
  --ink: #4a2f2a;
  --card: #fffaf0;
  --grass: #4cc764;
  --grass-deep: #2f9a4a;
  --pink: #ff6f91;
  --sun: #ffd23f;
  --violet: #9a6bff;
  --muted: #7a5a4e;
  --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--sky);
  color: var(--ink);
  font: 500 1.05rem/1.55 var(--body);
}
.wrap {
  max-width: 34rem;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hero {
  margin-top: calc(-1 * env(safe-area-inset-top, 0px));
  padding-top: calc(env(safe-area-inset-top, 0px) + 2rem);
  padding-bottom: 2.5rem;
  min-height: 100vh;
  background:
    repeating-conic-gradient(from 0deg at 50% 38%, #ffffff22 0deg 10deg, transparent 10deg 20deg),
    linear-gradient(var(--sky), var(--sky-deep) 140%);
  text-align: center;
}
.hero .wrap { display: grid; gap: 1rem; justify-items: center; }
.icon { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 6px 0 #0000001f; }
h1 {
  margin: 0;
  font: 700 clamp(2.8rem, 12vw, 4rem)/1 var(--display);
  letter-spacing: 0.01em;
  -webkit-text-stroke: 3px var(--ink);
  paint-order: stroke fill;
  text-shadow: 0 5px 0 #4a2f2a40;
}
h1 span:nth-child(1) { color: var(--pink); }
h1 span:nth-child(2) { color: var(--sky-deep); }
h1 span:nth-child(3) { color: var(--sun); }
.tag { margin: 0; font: 600 1.2rem/1.35 var(--display); max-width: 26rem; text-wrap: balance; }
.play {
  display: inline-flex; align-items: center; justify-content: center; gap: 0.6rem;
  width: min(100%, 24rem);
  padding: 0.95rem 1.4rem;
  border-radius: 18px;
  background: var(--grass);
  color: #fff;
  font: 700 1.2rem/1.15 var(--display);
  text-decoration: none;
  letter-spacing: 0.02em;
  box-shadow: 0 6px 0 var(--grass-deep);
  border: 3px solid #fff;
  transition: transform 0.12s, box-shadow 0.12s;
}
.play:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--grass-deep); }
.play:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--grass-deep); }
.play:focus-visible { outline: 4px solid var(--ink); outline-offset: 3px; }
.play .gp { width: 1.7rem; height: 1.85rem; flex: none; filter: drop-shadow(0 1px 0 #0003); }
.cta { position: relative; display: grid; justify-items: center; width: 100%; }
.play.tap { transform: translateY(4px); box-shadow: 0 2px 0 var(--grass-deep); }
.hand { position: absolute; width: 3.6rem; right: 12%; bottom: -2.4rem; opacity: 0; pointer-events: none; transform-origin: 30% 10%; }
.hand.go { animation: hand 1.6s ease-in-out 3; }
@keyframes hand {
  0% { opacity: 0; transform: translate(40px, 40px) rotate(-10deg); }
  25% { opacity: 1; transform: translate(0, 0) rotate(-10deg); }
  40% { transform: translate(0, -6px) scale(0.88) rotate(-10deg); }
  55% { transform: translate(0, 0) rotate(-10deg); }
  85% { opacity: 1; }
  100% { opacity: 0; transform: translate(0, 0) rotate(-10deg); }
}
.fine { margin: 0; font-size: 0.92rem; color: var(--ink); opacity: 0.85; }

.phone {
  width: min(100%, 17rem);
  aspect-ratio: 9 / 16;
  max-width: 100%;
  border: 8px solid var(--ink);
  border-radius: 34px;
  overflow: hidden;
  background: var(--ink);
  box-shadow: 0 10px 0 #4a2f2a33;
}
.phone video { width: 100%; height: 100%; object-fit: cover; display: block; }

@media (prefers-reduced-motion: reduce) { .play { transition: none; } .hand.go { animation-duration: 0.01s; } }
</style>
</head>
<body>
<header class="hero">
  <div class="wrap">
    <img class="icon" src="icon.png" alt="Grab It All app icon: Gobble the yellow blob" width="96" height="96">
    <h1 aria-label="Grab It All"><span>Grab</span> <span>It</span> <span>All</span></h1>
    <p class="tag">Steer Gobble with one thumb, grab every treat and dodge the lasers.</p>
    <div class="phone">
      <video src="trailer.mp4" poster="poster.jpg" autoplay muted loop playsinline preload="metadata" aria-label="Grab It All gameplay trailer"></video>
    </div>
    <div class="cta">
    <a class="play" id="play" href="https://play.google.com/store/apps/details?id=com.rohdev.io.grabitall&amp;referrer=utm_source%3Dinstagram%26utm_medium%3Dpaid_social%26utm_campaign%3Dlaunch_reel">
      <svg class="gp" viewBox="0 0 48 52" aria-hidden="true"><path fill="#00d7fe" d="M2.2 1.3C1.6 2 1.2 3 1.2 4.3v43.4c0 1.3.4 2.3 1 3l.2.2L26.8 26.6v-.6L2.4 1.1z"/><path fill="#ffce00" d="M34.9 34.7l-8.1-8.1v-.6l8.1-8.1.2.1 9.6 5.5c2.7 1.6 2.7 4.1 0 5.7l-9.6 5.5z"/><path fill="#ff3a44" d="M35.1 34.6l-8.3-8.3L2.2 50.9c.9 1 2.4 1.1 4.1.1l28.8-16.4"/><path fill="#00f076" d="M35.1 18L6.3 1.6C4.6.6 3.1.7 2.2 1.7l24.6 24.6z"/></svg>
      <span>Get it on Google Play Store</span>
    </a>
    <span class="hand" aria-hidden="true"><svg viewBox="0 0 64 64"><path fill="#ffd9b8" stroke="#4a2f2a" stroke-width="3" stroke-linejoin="round" d="M24 6c3 0 5 2 5 5v17l2-1c3-1 6 1 6 1l2-1c3-1 6 1 6 1 3-1 7 1 7 5v12c0 8-6 14-14 14h-6c-5 0-9-3-12-7l-9-13c-2-3 0-6 3-6 2 0 4 1 5 3l2 3V11c0-3 2-5 5-5z"/></svg></span>
    </div>
    <p class="fine">Free on Android</p>
  </div>
</header>

<script>
// After load, bring the install button into view, then show a hand tapping it (3 times).
window.addEventListener('load', function () {
  var btn = document.getElementById('play'), hand = document.querySelector('.hand');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  setTimeout(function () {
    window.scrollTo({ top: document.documentElement.scrollHeight, behavior: reduce ? 'auto' : 'smooth' });
    setTimeout(function () {
      if (reduce) return;
      hand.classList.add('go');
      [0, 1, 2].forEach(function (k) {  // press lands at 40% of each 1.6s hand cycle
        setTimeout(function () { btn.classList.add('tap'); setTimeout(function () { btn.classList.remove('tap'); }, 200); }, 640 + k * 1600);
      });
    }, 900);
  }, 1000);
});
</script>
</body>
</html>
